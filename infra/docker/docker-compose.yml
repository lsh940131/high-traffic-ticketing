# 로컬 개발용 의존 인프라 한 큐 기동
# 모든 상태 저장소에 healthcheck를 걸어, `docker compose up -d --wait` 로
# 전부 healthy 해진 뒤에 앱 서비스를 붙일 수 있게 한다.
services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ['CMD', 'cub', 'zk-ready', 'localhost:2181', '5']
      interval: 5s
      timeout: 8s
      retries: 12
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports: ['9092:9092']
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    # 브로커가 메타데이터를 실제로 서빙할 때까지 대기(포트 오픈만이 아니라 응답 확인)
    healthcheck:
      test:
        ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    ports: ['5432:5432']
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: ticketing
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticket -d ticketing']
      interval: 5s
      timeout: 3s
      retries: 10

  # 오브젝트 스토리지(S3 호환). 포스터 등 이미지 서빙. 로컬=MinIO, 운영=AWS S3(코드 동일).
  # 별도 1회성 setup 컨테이너를 두면 `up --wait`가 exit 0에도 실패(compose#10596)라,
  # 서버 기동 + posters 버킷/공개정책 보장을 한 컨테이너에서 자체 완결로 처리한다.
  minio:
    image: minio/minio:latest
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # 웹 콘솔
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ['miniodata:/data']
    # curl은 이미지에서 제거됨 → 번들된 mc로 준비 상태 확인
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        minio server /data --console-address ":9001" &
        until mc alias set local http://localhost:9000 minioadmin minioadmin 2>/dev/null; do sleep 1; done
        mc mb --ignore-existing local/posters
        mc anonymous set download local/posters
        wait

  prometheus:
    image: prom/prometheus:latest
    ports: ['9090:9090']
    volumes: ['./prometheus.yml:/etc/prometheus/prometheus.yml:ro']

  grafana:
    image: grafana/grafana:latest
    ports: ['3001:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  pgdata:
  miniodata:
