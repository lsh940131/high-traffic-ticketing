# 스케일 대상 3종의 CPU requests 상향 (base 200m → 500m).
#
# 이유 두 가지:
#  1) HPA의 averageUtilization은 **requests 대비**다. 200m 기준이면 70% = 140m라
#     부하가 걸리자마자 곧장 max까지 튀어 "서서히 증식"하는 그림이 안 나온다.
#     500m 기준이면 70% = 350m — 증식 계단이 눈에 보인다.
#  2) PC는 12스레드라 파드당 500m을 예약해도 gateway 8개(4000m) + 나머지가 넉넉히 들어간다.
#     노트북 4코어에선 불가능했던 설정.
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: ticketing }
spec:
  template:
    spec:
      containers:
        - name: gateway
          resources:
            requests: { cpu: '500m', memory: '256Mi' }
            limits: { cpu: '1', memory: '512Mi' }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: queue-service, namespace: ticketing }
spec:
  template:
    spec:
      containers:
        - name: queue-service
          resources:
            requests: { cpu: '500m', memory: '256Mi' }
            limits: { cpu: '1', memory: '512Mi' }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: reservation-service, namespace: ticketing }
spec:
  template:
    spec:
      containers:
        - name: reservation-service
          resources:
            requests: { cpu: '500m', memory: '256Mi' }
            limits: { cpu: '1', memory: '512Mi' }
