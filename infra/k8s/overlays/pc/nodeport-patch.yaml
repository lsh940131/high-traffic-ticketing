# 노트북(k6·브라우저)에서 LAN으로 들어오는 입구.
# k3d 클러스터 생성 시 아래 포트를 호스트에 매핑해야 한다(README-pc 참고):
#   -p "30300:30300@server:0" -p "30080:30080@server:0"
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: ticketing }
spec:
  type: NodePort
  ports:
    - { port: 3000, targetPort: 3000, nodePort: 30300 }
---
apiVersion: v1
kind: Service
metadata: { name: front, namespace: ticketing }
spec:
  type: NodePort
  ports:
    - { port: 80, targetPort: 80, nodePort: 30080 }
