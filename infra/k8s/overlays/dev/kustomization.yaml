apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ticketing
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: replicas-patch.yaml
  - path: gateway-nodeport-patch.yaml
images:
  - { name: ticketing-gateway, newName: 192.168.219.103:5000/ticketing-gateway, newTag: dev }
  - {
      name: ticketing-queue-service,
      newName: 192.168.219.103:5000/ticketing-queue-service,
      newTag: dev,
    }
  - {
      name: ticketing-reservation-service,
      newName: 192.168.219.103:5000/ticketing-reservation-service,
      newTag: dev,
    }
  - {
      name: ticketing-payment-service,
      newName: 192.168.219.103:5000/ticketing-payment-service,
      newTag: dev,
    }
  - { name: ticketing-front, newName: 192.168.219.103:5000/ticketing-front, newTag: dev }
  - {
      name: ticketing-user-service,
      newName: 192.168.219.103:5000/ticketing-user-service,
      newTag: dev,
    }
configMapGenerator:
  - name: back-config
    literals:
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - DATABASE_URL=postgresql://ticket:ticket@postgres:5432/ticketing
      - QUEUE_URL=http://queue-service:3101
      - RESERVATION_URL=http://reservation-service:3102
      - USER_URL=http://user-service:3104
      - QUEUE_ACTIVE_CAPACITY=1000
secretGenerator:
  - name: back-secret
    literals:
      - JWT_SECRET=dev-notebook
