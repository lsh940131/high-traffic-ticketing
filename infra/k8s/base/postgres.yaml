apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: ticketing }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: ticket }
            - { name: POSTGRES_PASSWORD, value: ticket }
            - { name: POSTGRES_DB, value: ticketing }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: ticketing }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
