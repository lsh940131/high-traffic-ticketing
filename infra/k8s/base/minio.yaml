# 공연 이미지(포스터/상세) 오브젝트 스토리지 (S3 호환). 운영은 AWS S3로 교체(aws overlay).
# 시드가 posters 버킷에 업로드하고, 브라우저가 posterUrl로 직접 조회한다.
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: ticketing }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ['server', '/data', '--console-address', ':9001']
          env:
            - { name: MINIO_ROOT_USER, value: 'minioadmin' }
            - { name: MINIO_ROOT_PASSWORD, value: 'minioadmin' }
          ports:
            - { containerPort: 9000 }
            - { containerPort: 9001 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits: { cpu: '1', memory: '512Mi' }
      volumes:
        - { name: data, emptyDir: {} }
---
# NodePort: PC(시드 업로드)와 LAN 브라우저(포스터 조회)가 같은 주소로 닿게 노출.
#   API      http://<노트북IP>:30900
#   console  http://<노트북IP>:30901
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: ticketing }
spec:
  type: NodePort
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000, nodePort: 30900 }
    - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }
