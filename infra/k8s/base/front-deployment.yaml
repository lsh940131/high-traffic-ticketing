apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: ticketing
spec:
  replicas: 1
  selector: { matchLabels: { app: front } }
  template:
    metadata: { labels: { app: front } }
    spec:
      containers:
        - name: front
          image: ticketing-front:latest
          ports: [{ containerPort: 80 }]
