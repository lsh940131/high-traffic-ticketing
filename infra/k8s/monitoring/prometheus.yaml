# Prometheus — 앱 5종 /metrics 스크레이프 + k6 remote-write 수신(부하 지표).
# 관측 애드온이라 앱 base/overlay와 분리해 별도 적용한다.
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: ticketing }
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      # 파드 단위 디스커버리. Service DNS를 static 타겟으로 잡으면 replica가 2개 이상일 때
      # 스크레이프마다 kube-proxy가 임의의 파드로 보내 카운터가 섞인다(= rate 왜곡, N분의 1만 보임).
      # endpoints role로 파드마다 개별 타겟을 잡아야 "replica↑ → 총 CPU·처리량↑" 곡선이 나온다.
      - job_name: ticketing-services
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: { names: [ticketing] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: gateway|queue-service|reservation-service|payment-service|user-service
            action: keep
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # instance를 파드명으로: 파드가 죽고 새로 뜰 때 시계열이 명확히 갈린다.
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
---
# 디스커버리용 권한 — 네임스페이스를 ticketing으로 한정했으므로 Role로 충분(ClusterRole 불필요).
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: ticketing }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: prometheus, namespace: ticketing }
rules:
  - apiGroups: ['']
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: prometheus, namespace: ticketing }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: ticketing }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: ticketing }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.enable-remote-write-receiver # k6 → Prometheus 스트리밍 수신
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits: { cpu: '1', memory: '512Mi' }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: ticketing }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - { name: web, port: 9090, targetPort: 9090, nodePort: 30990 }
