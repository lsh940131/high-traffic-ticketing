# Prometheus — 앱 5종 /metrics 스크레이프 + k6 remote-write 수신(부하 지표).
# 관측 애드온이라 앱 base/overlay와 분리해 별도 적용한다.
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: ticketing }
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: ticketing-services
        metrics_path: /metrics
        static_configs:
          - { targets: ['gateway:3000'],             labels: { service: gateway } }
          - { targets: ['queue-service:3101'],       labels: { service: queue-service } }
          - { targets: ['reservation-service:3102'], labels: { service: reservation-service } }
          - { targets: ['payment-service:3103'],     labels: { service: payment-service } }
          - { targets: ['user-service:3104'],        labels: { service: user-service } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: ticketing }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.enable-remote-write-receiver # k6 → Prometheus 스트리밍 수신
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits: { cpu: '1', memory: '512Mi' }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: ticketing }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - { name: web, port: 9090, targetPort: 9090, nodePort: 30990 }
