server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing
    username: ticketing
    password: ticketing_pw
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: local-ticketing-secret-key-must-be-at-least-256-bits-long
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
