server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: 알 수 없는 경로는 index.html로 폴백(react-router 클라이언트 라우팅)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 해시된 정적 에셋 장기 캐시
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 참고: /api 라우팅은 k8s ingress가 gateway로 보냄(여기서 프록시하지 않음).
}
